name: Reparar archivos grandes del monitor

on:
  workflow_dispatch:

concurrency:
  group: monitor-legislativo-uaf
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compactar estado, datos y dashboard
        run: python maintenance_compact.py

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Guardar reparación
        run: |
          git config user.name "monitor-legislativo-uaf[bot]"
          git config user.email "monitor-legislativo-uaf[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No hay archivos que reparar"
          else
            git commit -m "Reparar archivos sobredimensionados del monitor"
            git push
          fi

      - name: Empaquetar dashboard para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publicar dashboard reparado
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
