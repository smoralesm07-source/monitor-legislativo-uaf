name: Monitor legislativo UAF

on:
  workflow_dispatch:
  schedule:
    # Dos barridos diarios. GitHub interpreta este cron en UTC.
    # Chile continental: aproximadamente 08:17/17:17 en horario estándar
    # y 09:17/18:17 en horario de verano.
    - cron: "17 12,21 * * *"

concurrency:
  group: monitor-legislativo-uaf
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      MONITOR_EMAIL_ACTIVE: ${{ secrets.MONITOR_EMAIL_ACTIVE }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      PUBLIC_DASHBOARD_URL: ${{ secrets.PUBLIC_DASHBOARD_URL }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Ejecutar barrido legislativo
        run: python monitor.py

      - name: Guardar estado y dashboard en el repositorio
        run: |
          git config user.name "monitor-legislativo-uaf[bot]"
          git config user.email "monitor-legislativo-uaf[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar"
          else
            git commit -m "Actualización automática monitor legislativo UAF"
            git push
          fi

      - name: Empaquetar dashboard para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    name: Publicar dashboard
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
